# Runs on the PRIVATE inbox repository when a maintainer labels an issue
# `captura-revisada`. Opens a draft PR on the PUBLIC repo under sites/*/fixtures/inbox/.
#
# Required secrets (private repo):
#   PUBLIC_REPO_TOKEN  — fine-grained PAT or app token limited to contents:write on
#                        sites/*/fixtures/inbox/** of the public repository
#   PUBLIC_REPO        — owner/name of the public repository
#
# Checkout never uses code from the issue body — only the inbox path derived from
# the fingerprint already stored by the intake worker.

name: Promote capture to public inbox

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: promote-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  promote:
    if: github.event.label.name == 'captura-revisada'
    runs-on: ubuntu-latest
    steps:
      - name: Parse issue metadata
        id: meta
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            const grab = (label) => {
              const re = new RegExp(label + ':\\\\s*`([^`]+)`');
              const m = body.match(re);
              return m ? m[1] : '';
            };
            const siteId = grab('Portal');
            const url = grab('URL');
            const fingerprint = grab('Huella');
            if (!/^[a-z][a-z0-9-]*$/.test(siteId)) throw new Error('Invalid siteId');
            if (!/^[a-f0-9]{64}$/.test(fingerprint)) throw new Error('Invalid fingerprint');
            if (siteId.includes('..') || fingerprint.includes('..')) throw new Error('Traversal');
            core.setOutput('siteId', siteId);
            core.setOutput('url', url);
            core.setOutput('fingerprint', fingerprint);
            core.setOutput('dir', `inbox/${siteId}/${fingerprint}`);

      - name: Checkout private inbox files
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ${{ steps.meta.outputs.dir }}
          sparse-checkout-cone-mode: false

      - name: Validate files exist
        run: |
          test -f "${{ steps.meta.outputs.dir }}/page.html"
          test -f "${{ steps.meta.outputs.dir }}/page.css"
          test -f "${{ steps.meta.outputs.dir }}/meta.json"
          python3 - <<'PY'
          import json, pathlib, re, sys
          meta = json.loads(pathlib.Path("${{ steps.meta.outputs.dir }}/meta.json").read_text())
          assert meta["siteId"] == "${{ steps.meta.outputs.siteId }}"
          assert meta["fingerprint"] == "${{ steps.meta.outputs.fingerprint }}"
          assert re.fullmatch(r"[a-f0-9]{64}", meta["fingerprint"])
          html = pathlib.Path("${{ steps.meta.outputs.dir }}/page.html").read_text()
          for bad in ("<script", "jsessionid=", "type=\"hidden\""):
              if bad.lower() in html.lower():
                  print("Forbidden remnant:", bad, file=sys.stderr)
                  sys.exit(1)
          PY

      - name: Open draft PR on public repo
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          PUBLIC_REPO: ${{ secrets.PUBLIC_REPO }}
          SITE_ID: ${{ steps.meta.outputs.siteId }}
          FINGERPRINT: ${{ steps.meta.outputs.fingerprint }}
          PAGE_URL: ${{ steps.meta.outputs.url }}
          SRC_DIR: ${{ steps.meta.outputs.dir }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          DEST="sites/${SITE_ID}/fixtures/inbox/${FINGERPRINT}"
          BRANCH="inbox/${SITE_ID}/${FINGERPRINT}"
          WORK=$(mktemp -d)
          gh api "repos/${PUBLIC_REPO}/git/ref/heads/main" --jq .object.sha > /tmp/base_sha
          # Clone public repo shallow
          gh repo clone "$PUBLIC_REPO" "$WORK" -- --depth 1
          cd "$WORK"
          git checkout -b "$BRANCH"
          mkdir -p "$DEST"
          cp "$GITHUB_WORKSPACE/$SRC_DIR/page.html" "$DEST/"
          cp "$GITHUB_WORKSPACE/$SRC_DIR/page.css" "$DEST/"
          cp "$GITHUB_WORKSPACE/$SRC_DIR/meta.json" "$DEST/"
          git add "$DEST"
          if git diff --cached --quiet; then
            echo "Nothing to commit (already present)"
            exit 0
          fi
          git -c user.name="reforma-digital-bot" -c user.email="bot@users.noreply.github.com" \
            commit -m "Add pending page fixture for ${SITE_ID}"
          git push -u origin "$BRANCH"
          gh pr create --repo "$PUBLIC_REPO" --draft \
            --title "Página pendiente: ${SITE_ID} ${PAGE_URL}" \
            --body "Refs ${{ github.repository }}#${ISSUE}

          Fixture en \`${DEST}\`. No genera adaptador ni \`page.tsx\`."

      - name: Comment on private issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'PR draft abierta en el repositorio público (inbox).',
            });
