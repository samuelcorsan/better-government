<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Reforma Digital</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        padding: 12px;
        font-family: Arial, sans-serif;
        color: white;
        background: white;
      }
      main {
        height: 100%;
        border-radius: 28px;
        overflow: hidden;
        background:
          radial-gradient(
            90% 60% at 50% 128%,
            #ffd34d 0%,
            #ffbe0b 20%,
            #ff7a1a 45%,
            rgba(223, 23, 23, 0) 78%
          ),
          #df1717;
      }
      header {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 28px 40px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.25);
        font-size: 28px;
        font-weight: 700;
        line-height: 1;
      }
      h1 {
        max-width: 900px;
        margin: 86px auto 24px;
        font:
          400 76px/1.08 Georgia,
          serif;
        text-align: center;
        letter-spacing: -0.02em;
      }
      p {
        max-width: 690px;
        margin: 0 auto;
        font-size: 24px;
        line-height: 1.5;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <svg width="48" height="64" viewBox="0 0 144 192" xmlns="http://www.w3.org/2000/svg">
          <path fill="currentColor" d="M48 0H96V48H48V96H96V144H48V192H0V48H48Z" />
          <path fill="#a50e0e" d="M0 48L48 0V48Z" />
          <rect x="96" y="48" width="48" height="48" fill="currentColor" />
          <rect x="96" y="144" width="48" height="48" fill="currentColor" /></svg
        ><span>Reforma<br />Digital</span>
      </header>
      <h1>Lo público, a la altura<br />de las personas.</h1>
      <p>Herramientas y propuestas para una Administración más clara, accesible y sencilla.</p>
    </main>
  </body>
</html>
